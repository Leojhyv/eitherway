[package]
name = "eitherway-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "EitherWay rules (RULES.md) as plain Rust, independent of NEAR"

[dependencies]
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
